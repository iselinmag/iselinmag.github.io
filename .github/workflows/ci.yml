# Tests and deploys the portfolio.
# Every push and pull request runs the tests. A push to main deploys the site,
# but only when all tests pass.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test (HTML, links, WCAG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install test tools
        run: npm ci

      - name: Validate HTML
        run: npm run test:html

      - name: Check links
        run: npm run test:links

      - name: Start local server
        run: python3 -m http.server 8080 &

      - name: Test accessibility (WCAG 2 AA)
        run: npm run test:a11y

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Collect only the files to publish
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' \
            --exclude '_site' --exclude 'package*.json' --exclude '.pa11yci' \
            --exclude '.htmlvalidate.json' --exclude 'linkinator.config.json' \
            --exclude 'README.md' --exclude '.gitignore' ./ _site/

      - name: Bust browser cache for CSS and JS
        # Adds the commit id to the CSS and JS links, so browsers fetch the new
        # files after every deploy instead of mixing new HTML with old CSS.
        run: |
          v="${GITHUB_SHA::7}"
          find _site -name '*.html' -exec sed -i \
            -e "s#style\.css\"#style.css?v=$v\"#" \
            -e "s#ren-adresse\.js\"#ren-adresse.js?v=$v\"#" {} +
          grep -c "style.css?v=$v" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
